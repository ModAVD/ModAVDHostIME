name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25.0.4.1+1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+1.1'
      - name: Assert JDK version
        shell: bash
        run: |
          set -euo pipefail
          version="$(java -version 2>&1)"
          printf '%s\n' "$version"
          grep -F '25.0.4.1+1' <<<"$version"
      - name: Compile and run ProtocolTest
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prototest"
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d "$out" \
            ime/src/org/modavd/ime/HostProtocol.java ime/test/ProtocolTest.java
          java -cp "$out" org.modavd.ime.ProtocolTest

  apk-build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25.0.4.1+1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+1.1'
      - name: Assert JDK version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& java -version 2>&1 | Out-String)
          $version
          if ($version -notmatch '25\.0\.4\.1\+1') { throw "需要 Temurin 25.0.4.1+1，实际是：$version" }
      - name: Test SDK fallback and failure handling
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\test_android_sdk_fallback.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SDK fallback tests failed' }
      - name: Check android.jar and build APKs
        shell: pwsh
        env:
          TZ: CET-1
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedJarHash = 'd9eb9da824d9e247a352f570f01e1169e725b2954bca9e283a71786c59b59f9a'
          # repository2-3.xml: platforms;android-36 r2, SHA-1 2c1a80dd4d9f7d0e6dd336ec603d9b5c55a6f576.
          # Google publishes SHA-1 only; this SHA-256 was computed after checking it.
          $archiveName = 'platform-36_r02.zip'
          $expectedArchiveHash = '37607369a28c5b640b3a7998868d45898ebcb777565a0e85f9acf36f29631d2e'
          $jar = Join-Path $env:ANDROID_HOME 'platforms\android-36\android.jar'
          $sdkTemp = $null
          try {
            if (-not (Test-Path -LiteralPath $jar -PathType Leaf) -or
                (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedJarHash) {
              Write-Host '预装 android.jar 缺失或 SHA-256 不符，下载 Android 36 r2。'
              $sdkTemp = Join-Path $env:RUNNER_TEMP ("android-36-r2-" + [guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $sdkTemp | Out-Null
              $archive = Join-Path $sdkTemp $archiveName
              Invoke-WebRequest -Uri "https://dl.google.com/android/repository/$archiveName" -OutFile $archive
              $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expectedArchiveHash) { throw "SDK 压缩包 SHA-256 不符：$hash" }
              $sdk = Join-Path $sdkTemp 'sdk'
              Expand-Archive -LiteralPath $archive -DestinationPath $sdk
              $jar = Join-Path $sdk 'android-36\android.jar'
              if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw "找不到 $jar" }
              $hash = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expectedJarHash) { throw "android.jar SHA-256 不符：$hash" }
            }
            pwsh -NoProfile -File .\build.ps1 -BuildTools (Join-Path $env:ANDROID_HOME 'build-tools\36.1.0') -AndroidJar $jar
            if ($LASTEXITCODE -ne 0) { throw "APK 构建失败（退出码 $LASTEXITCODE）" }
          } finally {
            if ($sdkTemp -and (Test-Path -LiteralPath $sdkTemp)) {
              Remove-Item -LiteralPath $sdkTemp -Recurse -Force
            }
          }

  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files for private data
        shell: bash
        run: python3 -B -I -X utf8 scripts/privacy.py . --allowlist scripts/privacy-allowlist.json
      - name: Checkout ModAVD for the shared privacy scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ModAVD/ModAVD
          ref: main
          path: .modavd
          persist-credentials: false
          sparse-checkout: scripts/privacy.py
          sparse-checkout-cone-mode: false
      - name: scripts/privacy.py is ModAVD's
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s scripts/privacy.py .modavd/scripts/privacy.py; then
            echo "::error file=scripts/privacy.py::scripts/privacy.py differs from ModAVD/ModAVD main. The scanner is changed in ModAVD first; copy its scripts/privacy.py here byte for byte (only privacy-allowlist.json is this repository's own)."
            exit 1
          fi
          echo "scripts/privacy.py is the same as ModAVD/ModAVD main $(git -C .modavd rev-parse --short HEAD)"

  authors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECK_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      CHECK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CHECK_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - name: Checkout full history without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run repo checks unit tests
        shell: bash
        run: python3 -B -I -X utf8 scripts/test_repo_checks.py -v
      - name: Check commit authors and trailers
        shell: bash
        run: python3 -B -I -X utf8 scripts/repo_checks.py

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.32.0 (version and wheel hash pinned)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          printf '%s\n' 'zizmor==1.32.0 --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071' > "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes -r "$RUNNER_TEMP/zizmor-requirements.txt"
      - name: Audit workflows and Dependabot config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --no-progress .'
