name: Protocol self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      # ProtocolTest 只依赖 HostProtocol（只用 JDK 的类），不需要 Android SDK；编法和 build.ps1 一样
      - name: Compile and run ProtocolTest
        run: |
          out="$RUNNER_TEMP/prototest"
          javac --release 17 -encoding UTF-8 -Xlint:all -d "$out" \
            ime/src/org/modavd/ime/HostProtocol.java ime/test/ProtocolTest.java
          java -cp "$out" org.modavd.ime.ProtocolTest
